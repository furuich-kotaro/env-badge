<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Env Badge — Options</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Env Badge</h1>
        <p class="app__lede">
          Show a colored banner + badge so you never <em>fix prod by accident</em> again.
        </p>
      </header>

      <section class="card">
        <div class="card__header">
          <h2>Rules</h2>
          <div class="card__actions">
            <button id="add-rule" type="button" class="btn btn--primary">+ Add rule</button>
            <button id="reset-rules" type="button" class="btn btn--ghost">Reset defaults</button>
          </div>
        </div>
        <p class="hint">
          Rules are evaluated top to bottom — the first match wins. Patterns are matched
          against the tab's hostname (e.g. <code>app.example.com</code>).
        </p>
        <div id="rules" class="rules"></div>
      </section>

      <section class="card">
        <h2>Display</h2>
        <div class="grid">
          <label>
            <span>Position</span>
            <select id="position">
              <option value="top-left">Top left</option>
              <option value="top-right">Top right</option>
            </select>
          </label>
          <label>
            <span>Size</span>
            <select id="size">
              <option value="normal">Normal</option>
              <option value="huge">Huge</option>
            </select>
          </label>
        </div>
      </section>

      <footer class="app__footer">
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </footer>
    </main>

    <template id="rule-template">
      <div class="rule">
        <label class="rule__enabled">
          <input type="checkbox" data-field="enabled" />
        </label>
        <input class="rule__label" data-field="label" placeholder="LABEL" />
        <select data-field="kind">
          <option value="production">production</option>
          <option value="staging">staging</option>
          <option value="development">development</option>
          <option value="local">local</option>
        </select>
        <select data-field="patternType">
          <option value="glob">glob</option>
          <option value="regex">regex</option>
        </select>
        <input class="rule__pattern" data-field="pattern" placeholder="*.staging.example.com" />
        <div class="rule__order">
          <button type="button" data-action="up" title="Move up">▲</button>
          <button type="button" data-action="down" title="Move down">▼</button>
        </div>
        <button type="button" class="btn btn--danger" data-action="delete">Delete</button>
      </div>
    </template>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
