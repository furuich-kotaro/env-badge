<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Env Badge — Options</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Env Badge</h1>
        <p class="app__lede">
          Show a colored badge that tells you which environment the current tab is — so you
          never <em>fix prod by accident</em> again.
        </p>
      </header>

      <section class="card">
        <h2>Try a URL</h2>
        <div class="row">
          <input id="probe-input" type="text" placeholder="https://staging.example.com" />
          <span id="probe-result" class="probe-result">—</span>
        </div>
      </section>

      <section class="card">
        <div class="card__header">
          <h2>Rules</h2>
          <div class="card__actions">
            <button id="add-rule" type="button" class="btn btn--primary">+ Add rule</button>
            <button id="reset-rules" type="button" class="btn btn--ghost">Reset defaults</button>
          </div>
        </div>
        <p class="hint">
          Rules are evaluated top to bottom. The first match wins. Patterns match against the
          hostname (e.g. <code>app.example.com</code>).
        </p>
        <div id="rules" class="rules"></div>
      </section>

      <section class="card">
        <h2>Display</h2>
        <div class="grid">
          <label>
            <span>Position</span>
            <select id="position">
              <option value="top-left">Top left</option>
              <option value="top-right">Top right</option>
              <option value="bottom-left">Bottom left</option>
              <option value="bottom-right">Bottom right</option>
            </select>
          </label>
          <label>
            <span>Size</span>
            <select id="size">
              <option value="compact">Compact</option>
              <option value="normal">Normal</option>
              <option value="large">Large</option>
              <option value="huge">Huge</option>
            </select>
          </label>
          <label>
            <span>Display style</span>
            <select id="style">
              <option value="badge">Badge only</option>
              <option value="banner">Banner + badge</option>
              <option value="frame">Frame + badge</option>
              <option value="all">Banner + frame + badge</option>
            </select>
          </label>
          <label class="checkbox">
            <input id="stripes" type="checkbox" />
            <span>Diagonal stripes (more attention-grabbing)</span>
          </label>
          <label>
            <span>Opacity</span>
            <input id="opacity" type="range" min="0.3" max="1" step="0.02" />
            <output id="opacity-out"></output>
          </label>
          <label class="checkbox">
            <input id="show-unknown" type="checkbox" />
            <span>Show <strong>UNKNOWN</strong> badge for unmatched hosts</span>
          </label>
        </div>
      </section>

      <footer class="app__footer">
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </footer>
    </main>

    <template id="rule-template">
      <div class="rule">
        <div class="rule__drag" aria-hidden="true">⋮⋮</div>
        <label class="rule__enabled">
          <input type="checkbox" data-field="enabled" />
        </label>
        <input class="rule__label" data-field="label" placeholder="LABEL" />
        <select data-field="kind">
          <option value="production">production</option>
          <option value="staging">staging</option>
          <option value="development">development</option>
          <option value="local">local</option>
          <option value="custom">custom</option>
        </select>
        <select data-field="patternType">
          <option value="glob">glob</option>
          <option value="regex">regex</option>
        </select>
        <input class="rule__pattern" data-field="pattern" placeholder="*.staging.example.com" />
        <input class="rule__color" type="color" data-field="background" title="Background color" />
        <input class="rule__color" type="color" data-field="foreground" title="Text color" />
        <div class="rule__order">
          <button type="button" data-action="up" title="Move up">▲</button>
          <button type="button" data-action="down" title="Move down">▼</button>
        </div>
        <button type="button" class="btn btn--danger" data-action="delete">Delete</button>
      </div>
    </template>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
